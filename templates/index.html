<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LifeTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>LifeTrack</h1>
        <p>Track your day. Understand your time.</p>
    </header>


    <!-- Today's Summary -->
    <section>

        <h2>Today's Summary</h2>

        <div>
            <h3>Total Time</h3>
            <p id="total-time">0 hours</p>
        </div>

        <div>
            <h3>Most Time</h3>
            <p id="highest-task">No data</p>
        </div>

        <div>
            <h3>Least Time</h3>
            <p id="lowest-task">No data</p>
        </div>

    </section>


    <!-- Task Tracker -->
    <section>

        <h2>What are you doing?</h2>

        <button>🛁 Bathing</button>

        <button>👕 Getting Ready</button>

        <button>🚌 Traveling</button>

        <button>💻 Working</button>

        <button>📚 Studying</button>

        <button>😴 Resting</button>

        <button>🎮 Entertainment</button>

        <button>🍽️ Eating</button>

        <button>🏃 Exercise</button>

        <button>✨ Other</button>

    </section>


    <!-- Timer -->
    <section>

        <h2>Current Activity</h2>

        <p id="current-task">No activity</p>

        <p id="timer">00:00:00</p>

        <button>Start</button>

        <button>Stop</button>

    </section>


    <!-- Chart -->
    <section>

        <h2>Daily Time Distribution</h2>

        <div id="chart">
            Pie chart will appear here
        </div>

    </section>


    <!-- History -->
    <section>

        <h2>Today's History</h2>

        <div id="history">
            No activities recorded yet.
        </div>

    </section>
</body>

</html>
